<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Site Accessible</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button id="btn-theme">🌙</button>

    <header>
        <h1>Bienvenue sur mon site Web</h1>
    </header>
    <main>
        <p>Ceci est un paragraphe d'exemple, afin de tester la traduction en braille et la synthèse vocale.</p>
        <p>L'accessibilité web est essentielle. Pour permettre à tous d'utiliser Internet.</p>
    </main>

    <div id="a11y-container">
        <h3>Accessibilité</h3>
        <button id="btn-braille">Traduire en Braille</button>
        <button id="btn-text" style="display: none;">Revenir au texte normal</button>
        <button id="btn-speech">Lire à l'oral</button>
        <button id="btn-stop-speech" style="display: none;">Stopper la lecture</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
